<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>GroundsPH — Brand Guidelines</title>
        <style>
            /* injected by scripts/build-brand-pdf.ts */
            __BRAND_FONTS__
        </style>
        <style>
            __BRAND_CSS__
        </style>
    </head>
    <body>
        <!-- ===================== COVER ===================== -->
        <section class="cover">
            <span class="cover__eyebrow">Brand Guidelines</span>

            <div class="cover__lockup">
                <span class="cover__word">GROUNDS<span>.</span></span>
                <span class="cover__ph">PH</span>
            </div>

            <p class="cover__tagline">
                Discover the finest cafes across the archipelago
            </p>

            <div class="cover__rule"></div>

            <div class="cover__mark">
                <img src="../../public/icon.png" alt="GroundsPH winking mug mark" />
                <div class="cover__meta">
                    <strong>Version</strong>
                    $version$<br />
                    <strong style="margin-top: 3mm">Last updated</strong>
                    $date$
                </div>
            </div>

            <div class="cover__footer">
                <span>grounds.ph</span>
                <span>Made in Cebu, Philippines</span>
            </div>
        </section>

        <!-- ===================== CONTENTS ===================== -->
        <section class="toc">
            <h2>Contents</h2>
            $toc$
        </section>

        <!-- ===================== BODY ===================== -->
        <main class="doc">
            $body$
        </main>
    </body>
</html>
